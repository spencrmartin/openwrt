name: Build OpenMANET for Raspberry Pi 4 (Fixed)

on:
  workflow_dispatch:

jobs:
  build-openmanet-rpi4:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          g++ \
          gawk \
          gcc-multilib \
          git \
          gettext \
          libncurses5-dev \
          libssl-dev \
          python3-distutils \
          rsync \
          unzip \
          zlib1g-dev \
          swig \
          wget \
          curl \
          file \
          python3-dev \
          python3-setuptools
    
    # Debug: Check what's available
    - name: Debug - Check available boards and scripts
      run: |
        echo "=== Available boards ==="
        ls -la boards/
        echo ""
        echo "=== Available scripts ==="
        ls -la scripts/
        echo ""
        echo "=== Check morse_setup.sh ==="
        if [ -f scripts/morse_setup.sh ]; then
          echo "morse_setup.sh exists"
          head -20 scripts/morse_setup.sh
        else
          echo "morse_setup.sh NOT FOUND"
          find . -name "*setup*" -o -name "*morse*" | head -10
        fi
        echo ""
        echo "=== Check bcm2711 board config ==="
        if [ -d boards/ekh-bcm2711 ]; then
          echo "ekh-bcm2711 board exists"
          ls -la boards/ekh-bcm2711/
        else
          echo "ekh-bcm2711 board NOT FOUND"
        fi
    
    # Try manual configuration instead of morse_setup.sh
    - name: Manual build configuration for Pi 4
      run: |
        echo "=== Setting up manual configuration ==="
        
        # Initialize feeds first
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        
        # Create basic config for bcm27xx/bcm2711
        echo "CONFIG_TARGET_bcm27xx=y" > .config
        echo "CONFIG_TARGET_bcm27xx_bcm2711=y" >> .config
        echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
        
        # Add basic packages
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
        
        # Try to add morse packages if available
        if ./scripts/feeds list | grep -q morse; then
          echo "=== Found morse feed, adding morse packages ==="
          echo "CONFIG_PACKAGE_morsectrl=y" >> .config || true
        else
          echo "=== No morse feed found, building basic OpenWrt ==="
        fi
        
        # Generate full config
        make defconfig
        
        echo "=== Final configuration ==="
        grep "CONFIG_TARGET" .config || echo "No target config found"
    
    - name: Download dependencies
      run: |
        make download
    
    - name: Build OpenMANET/OpenWrt for Pi 4
      run: |
        # Build with verbose output and continue on error to get logs
        make -j$(nproc) V=s 2>&1 | tee build.log || {
          echo "Build failed, but continuing to collect logs..."
          exit_code=$?
          echo "Exit code: $exit_code"
        }
    
    - name: Collect build artifacts and logs
      if: always()
      run: |
        mkdir -p build-artifacts
        
        echo "=== Searching for build outputs ==="
        find . -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" | head -20
        
        # Copy any found images
        find bin/ -name "*.img*" -o -name "*.bin" -o -name "*.tar.gz" 2>/dev/null | while read file; do
          if [[ -f "$file" ]]; then
            echo "Found: $file"
            cp "$file" build-artifacts/
          fi
        done
        
        # Copy logs
        cp build.log build-artifacts/ 2>/dev/null || echo "No build.log found"
        
        # Create debug info
        echo "=== Build Debug Info ===" > build-artifacts/DEBUG_INFO.txt
        echo "Build Date: $(date)" >> build-artifacts/DEBUG_INFO.txt
        echo "Git Commit: $(git rev-parse HEAD)" >> build-artifacts/DEBUG_INFO.txt
        echo "" >> build-artifacts/DEBUG_INFO.txt
        echo "Final .config:" >> build-artifacts/DEBUG_INFO.txt
        cat .config >> build-artifacts/DEBUG_INFO.txt 2>/dev/null || echo "No .config found" >> build-artifacts/DEBUG_INFO.txt
        echo "" >> build-artifacts/DEBUG_INFO.txt
        echo "Available targets:" >> build-artifacts/DEBUG_INFO.txt
        ls -la target/linux/ >> build-artifacts/DEBUG_INFO.txt 2>/dev/null || echo "No targets found" >> build-artifacts/DEBUG_INFO.txt
        
        echo "=== Artifacts collected ==="
        ls -la build-artifacts/
    
    - name: Upload build results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: openmanet-pi4-debug-${{ github.run_number }}
        path: build-artifacts/
        retention-days: 30
    
    - name: Upload detailed logs
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: detailed-logs-${{ github.run_number }}
        path: |
          build.log
          logs/
          tmp/
        retention-days: 7
