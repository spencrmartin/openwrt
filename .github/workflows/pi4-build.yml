name: Build Pi4 OpenMANET

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: false
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          clang \
          flex \
          g++ \
          gawk \
          gcc-multilib \
          g++-multilib \
          git \
          gettext \
          libncurses5-dev \
          libncurses-dev \
          libssl-dev \
          python3-dev \
          python3-setuptools \
          python3-pip \
          rsync \
          unzip \
          zlib1g-dev \
          swig \
          wget \
          curl \
          file \
          bc \
          zip \
          time \
          ccache \
          libc6-dev-i386
        
        python3 -m pip install --break-system-packages setuptools wheel || \
        python3 -m pip install setuptools wheel || true
        
        echo "Dependencies installed successfully"
    
    - name: Debug system and repository
      run: |
        echo "=== System Info ==="
        uname -a
        python3 --version
        echo "=== Available boards ==="
        ls -la boards/ | head -10
        echo "=== Check bcm2711 board ==="
        if [ -d boards/ekh-bcm2711 ]; then
          echo "ekh-bcm2711 board exists"
          ls -la boards/ekh-bcm2711/
        else
          echo "ekh-bcm2711 board NOT FOUND"
          ls -la boards/ | grep bcm || echo "No bcm boards found"
        fi
    
    - name: Initialize feeds
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a
    
    - name: Configure for Pi 4
      run: |
        if [ -f scripts/morse_setup.sh ] && [ -d boards/ekh-bcm2711 ]; then
          echo "Trying morse_setup.sh..."
          chmod +x scripts/morse_setup.sh
          if ./scripts/morse_setup.sh -i -b ekh-bcm2711; then
            echo "morse_setup.sh succeeded"
            CONFIG_SUCCESS=1
          else
            echo "morse_setup.sh failed, using manual config"
          fi
        fi
        
        if [ "$CONFIG_SUCCESS" != "1" ]; then
          echo "Using manual Pi 4 configuration"
          echo "CONFIG_TARGET_bcm27xx=y" > .config
          echo "CONFIG_TARGET_bcm27xx_bcm2711=y" >> .config
          echo "CONFIG_TARGET_MULTI_PROFILE=y" >> .config
          echo "CONFIG_TARGET_ALL_PROFILES=y" >> .config
          echo "CONFIG_PACKAGE_luci=y" >> .config
          echo "CONFIG_PACKAGE_luci-ssl-openssl=y" >> .config
          echo "CONFIG_TARGET_ROOTFS_PARTSIZE=512" >> .config
          
          if ./scripts/feeds list | grep -q morse; then
            echo "Adding morse packages..."
            echo "CONFIG_PACKAGE_morsectrl=y" >> .config
          fi
          
          make defconfig
        fi
        
        echo "Configuration complete"
        grep "CONFIG_TARGET" .config | head -5
    
    - name: Download dependencies
      run: |
        make download -j$(nproc) || make download -j1
    
    - name: Build OpenMANET for Pi 4
      run: |
        echo "Starting build at $(date)"
        echo "Using $(nproc) CPU cores"
        
        if make -j$(nproc) 2>&1 | tee build.log; then
          echo "Build completed successfully"
          BUILD_SUCCESS=1
        else
          echo "Parallel build failed, trying single-threaded..."
          if make -j1 V=s 2>&1 | tee build-single.log; then
            echo "Single-threaded build completed"
            BUILD_SUCCESS=1
          else
            echo "Build failed"
            BUILD_SUCCESS=0
          fi
        fi
        
        echo "BUILD_SUCCESS=$BUILD_SUCCESS" >> $GITHUB_ENV
    
    - name: Collect build artifacts
      if: always()
      run: |
        mkdir -p artifacts
        
        if [ -d "bin/targets/bcm27xx/bcm2711" ]; then
          echo "Found Pi 4 build directory"
          ls -la bin/targets/bcm27xx/bcm2711/
          cp -r bin/targets/bcm27xx/bcm2711/* artifacts/ || echo "Copy failed"
        else
          echo "No Pi 4 build directory found"
          find bin/targets/ -type d 2>/dev/null || echo "No targets found"
        fi
        
        find bin/ -name "*.img*" -o -name "*.tar.gz" -o -name "*.bin" 2>/dev/null | head -10 | while read f; do
          if [ -f "$f" ]; then
            echo "Found: $f"
            cp "$f" artifacts/ || echo "Failed to copy $f"
          fi
        done
        
        cp build.log artifacts/ 2>/dev/null || echo "No build.log"
        cp build-single.log artifacts/ 2>/dev/null || echo "No single build log"
        cp .config artifacts/final.config 2>/dev/null || echo "No config"
        
        echo "=== OpenMANET Pi 4 Build Summary ===" > artifacts/BUILD_SUMMARY.txt
        echo "Build Date: $(date)" >> artifacts/BUILD_SUMMARY.txt
        echo "Repository: https://github.com/spencrmartin/openwrt" >> artifacts/BUILD_SUMMARY.txt
        echo "Target: bcm27xx/bcm2711 (Raspberry Pi 4)" >> artifacts/BUILD_SUMMARY.txt
        echo "Build Success: ${BUILD_SUCCESS:-unknown}" >> artifacts/BUILD_SUMMARY.txt
        echo "" >> artifacts/BUILD_SUMMARY.txt
        echo "Files in this build:" >> artifacts/BUILD_SUMMARY.txt
        ls -la artifacts/ >> artifacts/BUILD_SUMMARY.txt 2>/dev/null || echo "No files listed" >> artifacts/BUILD_SUMMARY.txt
        
        echo "Final artifacts:"
        ls -la artifacts/
        
        IMG_COUNT=$(find artifacts/ -name "*.img*" 2>/dev/null | wc -l)
        if [ "$IMG_COUNT" -gt 0 ]; then
          echo "Found $IMG_COUNT image files"
        else
          echo "No image files found"
        fi
    
    - name: Upload Pi 4 build artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: pi4-openmanet-build-${{ github.run_number }}
        path: artifacts/
        retention-days: 30
    
    - name: Build completion summary
      if: always()
      run: |
        echo "=== BUILD COMPLETION SUMMARY ==="
        if [ -f artifacts/BUILD_SUMMARY.txt ]; then
          cat artifacts/BUILD_SUMMARY.txt
        fi
        
        if find artifacts/ -name "*.img*" | grep -q .; then
          echo ""
          echo "SUCCESS: Pi 4 images built and ready!"
          echo "Download the artifacts above and flash to your Pi 4 SD card"
          echo "This will fix your solid red light issue"
        else
          echo ""
          echo "No image files found, but build logs are available for debugging"
        fi
